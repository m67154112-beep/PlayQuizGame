    <script>

                        breakdown: {

                        options: ["小心翼翼", "光明正大", "理直氣壯", "大搖大擺"],

                            D: "【錯誤】「大搖大擺」形容走路傲慢或動作誇張，與怕被發現的情境不符。"
                        }
                    }
                ],
                5: [
                    {
                        stem: "閱讀下列語句：「（ ）天氣多麼惡劣，搜救隊（ ）堅持登頂搜尋失蹤的登山客。」括號中最適當的關聯詞是：",
                        options: ["無論……都……", "因為……所以……", "雖然……但是……", "不僅……而且……"],
                        answer: 0,
                        source: "StudyArk酷課雲 / Melances題庫網",

        // ==========================================

        // ==========================================
        function generateProceduralQuestion(grade, subject) {
            const seedList = (RAG_DATABASE[subject] && RAG_DATABASE[subject][grade]) || [];
            
            // 數學動態合成範本
            if (subject === 'math') {
                const names = ["小明", "小華", "小美", "阿杰", "安安", "佩佩"];
                const items = ["蘋果", "公仔", "卡片", "珍珠奶茶", "魔法積木", "筆記本"];
                const name = names[Math.floor(Math.random() * names.length)];
                const item = items[Math.floor(Math.random() * items.length)];

                if (grade <= 2) {
                    const a = Math.floor(Math.random() * 40) + 10;
                    const b = Math.floor(Math.random() * 30) + 5;
                    const total = a + b;
                    return {
                        stem: `${name} 原有 ${a} 個${item}，今天生日朋友又送給他 ${b} 個，請問 ${name} 現在總共有幾個${item}？`,
                        options: [`${total} 個`, `${total + 2} 個`, `${total - 3} 個`, `${total + 5} 個`],
                        answer: 0,
                        source: "ZeroEgg 考卷產生器 / NCU eMath",
                        keypoint: "基礎兩位數加法與應用題語意理解。",
                        breakdown: {
                            A: `【正確】正確列式計算：${a} + ${b} = ${total}。`,
                            B: `【錯誤】計算錯誤，多加了 2。`,
                            C: `【錯誤】計算錯誤，誤減去 3。`,
                            D: `【錯誤】計算錯誤，多計了 5。`
                        }
                    };
                } else if (grade <= 4) {
                    const price = (Math.floor(Math.random() * 8) + 2) * 10;
                    const qty = Math.floor(Math.random() * 6) + 3;
                    const cost = price * qty;
                    return {
                        stem: `校園合作社販售${item}，每個售價 ${price} 元。園遊會時班上購買了 ${qty} 個，請問一共需要支付多少元？`,
                        options: [`${cost} 元`, `${cost + 10} 元`, `${price + qty} 元`, `${cost - 20} 元`],
                        answer: 0,
                        source: "均一教育平台 Junyi Test",
                        keypoint: "乘法應用：總價 = 單價 × 數量。",
                        breakdown: {
                            A: `【正確】計算式為：${price} × ${qty} = ${cost} 元。`,
                            B: `【錯誤】計算錯誤，比正確金額多 10 元。`,
                            C: `【錯誤】概念錯誤，直接將單價與數量相加 (${price} + ${qty})。`,
                            D: `【錯誤】計算錯誤，少算了 20 元。`
                        }
                    };
                } else {
                    const speed = Math.floor(Math.random() * 20) + 50; // km/h
                    const hours = Math.floor(Math.random() * 3) + 2;
                    const dist = speed * hours;
                    return {
                        stem: `阿航開車前往花蓮，行駛平均時速為 ${speed} 公里/小時，連續行駛了 ${hours} 小時後到達目的地。請問總行程是多少公里？`,
                        options: [`${dist} 公里`, `${dist + 15} 公里`, `${(speed / hours).toFixed(1)} 公里`, `${dist - 10} 公里`],
                        answer: 0,
                        source: "Tcool題庫網 / NCU eMath",
                        keypoint: "速率、時間與距離關係：距離 = 速率 × 時間。",
                        breakdown: {
                            A: `【正確】正確運用公式：${speed} (公里/小時) × ${hours} (小時) = ${dist} 公里。`,
                            B: `【錯誤】數值計算過大。`,
                            C: `【錯誤】公式誤用為速率除以時間。`,
                            D: `【錯誤】計算失誤。`
                        }
                    };
                }
            }

            // 英文動態合成範本
            if (subject === 'eng') {
                const verbs = [
                    { v: "play basketball", past: "played basketball", prog: "is playing basketball" },
                    { v: "read a book", past: "read a book", prog: "is reading a book" },
                    { v: "cook dinner", past: "cooked dinner", prog: "is cooking dinner" }
                ];
                const item = verbs[Math.floor(Math.random() * verbs.length)];
                
                return {
                    stem: `Look at the situation: 'Listen! Quiet please. The teacher _____ in the classroom right now.' Which fits best?`,
                    options: ["is speaking", "spoke", "speaks", "will speak"],
                    answer: 0,
                    source: "TYKJH 英語題庫網 / Melances",
                    keypoint: "現在進行式 (Present Continuous) 用法，配合提示詞 right now / Listen。",
                    breakdown: {
                        A: "【正確】right now 提示動作正在進行，須使用 be動詞 + V-ing (is speaking)。",
                        B: "【錯誤】spoke 為過去式，不符 right now 語境。",
                        C: "【錯誤】speaks 為習慣性現在簡單式。",
                        D: "【錯誤】will speak 為未來式。"
                    }
                };
            }

            // 國文動態語意範本
            const idioms = [
                { word: "畫蛇添足", meaning: "比喻多此一舉，反而弄巧成拙。", wrong: "形容繪畫技巧非常精湛生動。" },
                { word: "井底之蛙", meaning: "比喻見識淺薄的人。", wrong: "形容蛙類生存環境十分潔淨。" },
                { word: "守株待兔", meaning: "比喻拘泥守舊，或企圖不勞而獲。", wrong: "比喻非常愛護小動物。" }
            ];
            const target = idioms[Math.floor(Math.random() * idioms.length)];

            return {
                stem: `關於成語「${target.word}」的文意理解，下列選項何者說明最適當？`,
                options: [target.meaning, target.wrong, "比喻做事非常迅速敏捷。", "形容朋友之間的感情極為深厚。"],
                answer: 0,
                source: "Tcool題庫網 / 學習舟StudyArk",
                keypoint: `常用成語「${target.word}」的典故與語意辨析。`,
                breakdown: {
                    A: `【正確】${target.meaning}`,
                    B: `【錯誤】此為字面誤解，${target.wrong}`,
                    C: `【錯誤】與「${target.word}」之含意無關。`,
                    D: `【錯誤】此為張冠李戴之解釋。`
                }
            };
        }

        // 題目唯一指紋計算（去重機制）
        function computeHash(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = (hash << 5) - hash + str.charCodeAt(i);
                hash |= 0;
            }
            return hash.toString();
        }

        // 取得一題不重複題目
        function getUniqueQuestion(grade, subject) {
            let attempts = 0;
            while (attempts < 20) {
                attempts++;
                let q = null;
                const seeds = (RAG_DATABASE[subject] && RAG_DATABASE[subject][grade]) || [];

                if (seeds.length > 0 && Math.random() < 0.5) {
                    q = seeds[Math.floor(Math.random() * seeds.length)];
                } else {
                    q = generateProceduralQuestion(grade, subject);
                }

                const hash = computeHash(q.stem);
                if (!state.answeredHashes.has(hash)) {
                    state.answeredHashes.add(hash);
                    return q;
                }
            }
            // 若重複上限，重置去重集合
            state.answeredHashes.clear();
            return generateProceduralQuestion(grade, subject);
        }

        // ==========================================
        // 3. AI (Gemini API) 實時擴充出題邏輯
        // ==========================================
        async function fetchGeminiAIQuestion(grade, subject) {
            if (!state.apiKey) throw new Error("無 API Key");

            const subjMap = { chi: "國語文", eng: "英語文", math: "數學" };
            const prompt = `你是一位台灣108課綱國小專家。請為國小 ${grade} 年級 ${subjMap[subject]} 科目，出乙道高品質、生活化且符合課綱的選擇題。
            必須嚴格回傳標準JSON格式，格式如下，不要加任何markdown或多餘文字：
            {
              "stem": "題目內容...",
              "options": ["選項A", "選項B", "選項C", "選項D"],
              "answer": 0,
              "source": "Gemini AI 實時 108 課綱命題",
              "keypoint": "核心學習重點解說",
              "breakdown": {
                "A": "選項A詳細註釋與解析",
                "B": "選項B詳細註釋與解析",
                "C": "選項C詳細註釋與解析",
                "D": "選項D詳細註釋與解析"
              }
            }`;

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${state.apiKey}`;
            const res = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }]
                })
            });

            if (!res.ok) throw new Error("API 請求失敗");
            const data = await res.json();
            const text = data.candidates[0].content.parts[0].text;
            const cleanJson = text.replace(/```json/g, '').replace(/```/g, '').trim();
            return JSON.parse(cleanJson);
        }

        // ==========================================
        // 4. UI 渲染與事件互動
        // ==========================================
        const DOM = {
            gradeSelect: document.getElementById('gradeSelect'),
            subjectSelect: document.getElementById('subjectSelect'),
            sourceBadge: document.getElementById('sourceBadge'),
            questionSeq: document.getElementById('questionSeq'),
            streakCount: document.getElementById('streakCount'),
            accuracyRate: document.getElementById('accuracyRate'),
            questionText: document.getElementById('questionText'),
            optionsContainer: document.getElementById('optionsContainer'),
            explanationPanel: document.getElementById('explanationPanel'),
            resultBanner: document.getElementById('resultBanner'),
            learningKeyPoint: document.getElementById('learningKeyPoint'),
            optionsBreakdown: document.getElementById('optionsBreakdown'),
            prevBtn: document.getElementById('prevBtn'),
            nextBtn: document.getElementById('nextBtn'),
            ttsBtn: document.getElementById('ttsBtn'),
            aiModalBtn: document.getElementById('aiModalBtn'),
            aiModal: document.getElementById('aiModal'),
            closeAiModal: document.getElementById('closeAiModal'),
            saveAiSettings: document.getElementById('saveAiSettings'),
            apiKeyInput: document.getElementById('apiKeyInput'),
            enableAiToggle: document.getElementById('enableAiToggle'),
            notebookBtn: document.getElementById('notebookBtn'),
            notebookModal: document.getElementById('notebookModal'),
            closeNotebookModal: document.getElementById('closeNotebookModal'),
            closeNotebookModal2: document.getElementById('closeNotebookModal2'),
            notebookList: document.getElementById('notebookList'),
            notebookCount: document.getElementById('notebookCount'),
            clearNotebookBtn: document.getElementById('clearNotebookBtn')
        };

        // 載入題目
        async function loadQuestion(isNext = true) {
            if (isNext) {
                if (state.currentIndex < state.history.length - 1) {
                    state.currentIndex++;
                    state.currentQuestion = state.history[state.currentIndex];
                    renderQuestion();
                    return;
                }

                // 新產生題目
                DOM.questionText.innerHTML = `<span class="text-indigo-500 font-normal"><i class="fa-solid fa-spinner fa-spin"></i> 正在檢索與生成題目中...</span>`;
                DOM.optionsContainer.innerHTML = '';
                DOM.explanationPanel.classList.add('hidden');

                let q = null;
                if (state.aiEnabled && state.apiKey) {
                    try {
                        q = await fetchGeminiAIQuestion(state.grade, state.subject);
                    } catch (e) {
                        console.warn("AI 生成失敗，退回 RAG 題庫模組:", e);
                        q = getUniqueQuestion(state.grade, state.subject);
                    }
                } else {
                    q = getUniqueQuestion(state.grade, state.subject);
                }

                state.history.push(q);
                state.currentIndex = state.history.length - 1;
                state.currentQuestion = q;
            } else {
                if (state.currentIndex > 0) {
                    state.currentIndex--;
                    state.currentQuestion = state.history[state.currentIndex];
                }
            }

            renderQuestion();
        }

        // 渲染當前題目至 DOM
        function renderQuestion() {
            const q = state.currentQuestion;
            if (!q) return;

            DOM.sourceBadge.innerHTML = `<i class="fa-solid fa-database text-xs"></i> ${q.source || '綜合實體題庫 RAG'}`;
            DOM.questionSeq.innerText = `題目序號: #${state.currentIndex + 1}`;
            DOM.questionText.innerText = q.stem;
            DOM.explanationPanel.classList.add('hidden');

            // 渲染選項
            DOM.optionsContainer.innerHTML = '';
            const labels = ['A', 'B', 'C', 'D'];

            q.options.forEach((optText, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-xl border-2 border-gray-200 hover:border-indigo-400 hover:bg-indigo-50/50 transition flex items-center gap-3 font-medium text-gray-700 shadow-sm option-btn`;
                btn.innerHTML = `
                    <span class="w-8 h-8 rounded-lg bg-gray-100 border border-gray-300 font-bold text-indigo-700 flex items-center justify-center flex-shrink-0 option-label">${labels[idx]}</span>
                    <span class="flex-grow">${optText}</span>
                `;
                btn.onclick = () => handleAnswer(idx);
                DOM.optionsContainer.appendChild(btn);
            });

            // 更新按鈕狀態
            DOM.prevBtn.disabled = (state.currentIndex <= 0);

            // 如果該題已答過，直接展示解析
            if (q.userAnswer !== undefined) {
                showExplanation(q.userAnswer);
            }
        }

        // 處理作答選擇
        function handleAnswer(selectedIndex) {
            const q = state.currentQuestion;
            if (q.userAnswer !== undefined) return; // 避免重複選擇

            q.userAnswer = selectedIndex;
            const isCorrect = (selectedIndex === q.answer);

            // 更新統計
            state.stats.total++;
            if (isCorrect) {
                state.stats.correct++;
                state.stats.streak++;
            } else {
                state.stats.streak = 0;
                // 放入錯題本
                if (!state.wrongNotebook.some(item => item.stem === q.stem)) {
                    state.wrongNotebook.push(q);
                    updateNotebookCount();
                }
            }

            updateStatsDisplay();
            showExplanation(selectedIndex);
        }

        // 展露詳細解析
        function showExplanation(selectedIndex) {
            const q = state.currentQuestion;
            const isCorrect = (selectedIndex === q.answer);
            const labels = ['A', 'B', 'C', 'D'];

            // 標示選項按鈕顏色
            const btns = DOM.optionsContainer.querySelectorAll('.option-btn');
            btns.forEach((btn, idx) => {
                btn.disabled = true;
                btn.classList.remove('hover:border-indigo-400', 'hover:bg-indigo-50/50');
                if (idx === q.answer) {
                    btn.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-900');
                    btn.querySelector('.option-label').classList.add('bg-emerald-500', 'text-white', 'border-emerald-500');
                } else if (idx === selectedIndex && !isCorrect) {
                    btn.classList.add('border-rose-500', 'bg-rose-50', 'text-rose-900');
                    btn.querySelector('.option-label').classList.add('bg-rose-500', 'text-white', 'border-rose-500');
                }
            });

            // Banner
            if (isCorrect) {
                DOM.resultBanner.className = "p-4 rounded-xl font-bold flex items-center gap-3 bg-emerald-100 text-emerald-800 border border-emerald-200 animate-bounce-short";
                DOM.resultBanner.innerHTML = `<i class="fa-solid fa-circle-check text-2xl text-emerald-600"></i> 答對了！太棒了，繼續保持！`;
            } else {
                DOM.resultBanner.className = "p-4 rounded-xl font-bold flex items-center gap-3 bg-rose-100 text-rose-800 border border-rose-200";
                DOM.resultBanner.innerHTML = `<i class="fa-solid fa-circle-xmark text-2xl text-rose-600"></i> 答錯囉！正確答案是 (${labels[q.answer]})`;
            }

            // 重點
            DOM.learningKeyPoint.innerText = q.keypoint || "遵循教育部 108 課綱的核心素養評量導向設計。";

            // 四選項註釋
            DOM.optionsBreakdown.innerHTML = '';
            labels.forEach((label, idx) => {
                const itemDiv = document.createElement('div');
                const expl = (q.breakdown && q.breakdown[label]) ? q.breakdown[label] : `選項 (${label}) 之綜合剖析。`;
                const isAns = (idx === q.answer);

                itemDiv.className = `p-3 rounded-lg border ${isAns ? 'bg-emerald-50/80 border-emerald-200 text-emerald-900 font-semibold' : 'bg-white border-gray-200 text-gray-700'}`;
                itemDiv.innerHTML = `<span class="font-bold mr-1 hover:underline">選項 (${label})</span> ${expl}`;
                DOM.optionsBreakdown.appendChild(itemDiv);
            });

            DOM.explanationPanel.classList.remove('hidden');
        }

        // 更新統計數據 Display
        function updateStatsDisplay() {
            DOM.streakCount.innerText = state.stats.streak;
            const rate = state.stats.total > 0 ? Math.round((state.stats.correct / state.stats.total) * 100) : 100;
            DOM.accuracyRate.innerText = `${rate}%`;
        }

        function updateNotebookCount() {
            DOM.notebookCount.innerText = state.wrongNotebook.length;
        }

        // 語音朗讀 TTS
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = state.subject === 'eng' ? 'en-US' : 'zh-TW';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        // ==========================================
        // 5. 事件監聽設定
        // ==========================================
        DOM.gradeSelect.onchange = (e) => {
            state.grade = e.target.value;
            state.history = [];
            state.currentIndex = -1;
            loadQuestion(true);
        };

        DOM.subjectSelect.onchange = (e) => {
            state.subject = e.target.value;
            state.history = [];
            state.currentIndex = -1;
            loadQuestion(true);
        };

        DOM.prevBtn.onclick = () => loadQuestion(false);
        DOM.nextBtn.onclick = () => loadQuestion(true);

        DOM.ttsBtn.onclick = () => {
            if (state.currentQuestion) {
                speakText(state.currentQuestion.stem);
            }
        };

        // AI Modal 事件
        DOM.aiModalBtn.onclick = () => DOM.aiModal.classList.remove('hidden');
        DOM.closeAiModal.onclick = () => DOM.aiModal.classList.add('hidden');
        DOM.saveAiSettings.onclick = () => {
            state.apiKey = DOM.apiKeyInput.value.trim();
            state.aiEnabled = DOM.enableAiToggle.checked;
            DOM.aiModal.classList.add('hidden');
            alert(state.aiEnabled ? "已成功啟用 Gemini AI 實時命題模式！" : "已關閉 AI 模式，恢復使用內建智慧題庫。");
        };

        // 錯題本 Modal 事件
        DOM.notebookBtn.onclick = () => {
            renderNotebook();
            DOM.notebookModal.classList.remove('hidden');
        };
        DOM.closeNotebookModal.onclick = () => DOM.notebookModal.classList.add('hidden');
        DOM.closeNotebookModal2.onclick = () => DOM.notebookModal.classList.add('hidden');

        DOM.clearNotebookBtn.onclick = () => {
            if (confirm("確定要清空所有的錯題紀錄嗎？")) {
                state.wrongNotebook = [];
                updateNotebookCount();
                renderNotebook();
            }
        };

        function renderNotebook() {
            if (state.wrongNotebook.length === 0) {
                DOM.notebookList.innerHTML = `<div class="text-center py-8 text-gray-400">尚無錯題紀錄，繼續保持全對吧！</div>`;
                return;
            }

            DOM.notebookList.innerHTML = '';
            state.wrongNotebook.forEach((q, i) => {
                const div = document.createElement('div');
                div.className = "p-4 bg-amber-50/50 border border-amber-200 rounded-xl space-y-2";
                div.innerHTML = `
                    <div class="font-bold text-gray-800">#${i + 1} ${q.stem}</div>
                    <div class="text-xs text-emerald-700 font-semibold">正確答案：${q.options[q.answer]}</div>
                    <div class="text-xs text-gray-600 bg-white p-2 rounded border border-amber-100">${q.keypoint}</div>
                `;
                DOM.notebookList.appendChild(div);
            });
        }

        // 初始化系統
        window.onload = () => {
            loadQuestion(true);
        };
    </script>
</body>
</html>
