    <script>
        // ==========================================
        // 全局狀態與預設設定宣告
        // ==========================================
        const DEFAULT_API_KEY = 'AQ.Ab8RN6K9d3TmGt1UzlN_0xylEllVGoqtkJkQoBGH_pQCw87oZA';
        let currentGrade = 1;               // 預設國小一年級
        let currentSubject = 'math';         // 預設數學科
        
        let currentQuestion = null;          // 當前題目物件
        let questionHistory = [];            // 題目歷史紀錄 (用於上一題/下一題)
        let historyIndex = -1;               // 歷史紀錄指標
        let wrongQuestions = [];             // 錯題本資料庫
        let seenQuestionHashes = new Set();  // 防重複題目 Hash 記憶庫 (嚴格去重)
        
        let prefetchQueue = [];              // 背景預載佇列 (極速出題)
        let isPrefetching = false;           // 預載中狀態標記

        let timerInterval = null;            // 倒數計時器句柄
        let timerSeconds = 60;               // 每題 60 秒倒數
        let isAnswered = false;              // 當前題作答狀態
        let selectedOptionIndex = null;      // 使用者選擇的選項

        let stats = {                        // 統計數據
            total: 0,
            correct: 0,
            wrong: 0,
            uniqueSeen: 0
        };

        // 思考模式與生活化情境切入點庫（結合程序化生成與 AI Prompt 雙向使用）
        const lifeScenarios = [
            { type: "生活情境", names: ['小明', '小華', '小雅', '婷婷', '安安'], items: ['文具', '圖書', '水果', '貼紙', '點心'], verbs: ['購買了', '收集了', '整理了'] },
            { type: "校園活動", names: ['班長小美', '大衛', '小智', '隊長阿哲', '林同學'], items: ['競賽積分', '圖書借閱', '榮譽貼紙', '跑圈次數'], verbs: ['挑戰獲得了', '紀錄突破了', '累積了'] },
            { type: "自然探索", names: ['小小科學家', '太空人', '研究員', '探險家'], items: ['觀察樣本', '實驗數據', '能量晶片', '植物種子'], verbs: ['採集了', '記錄了', '分析了'] }
        ];

        // 工具函數：字串簡單 Hash 計算
        function calcHash(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash |= 0;
            }
            return Math.abs(hash).toString(36);
        }

        // 工具函數：陣列隨機洗牌
        function shuffleArray(arr) {
            const array = [...arr];
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function getRandomElem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        // ==========================================
        // 程序化萬級無限客製化引擎 (參考各大題庫網題型)
        // ==========================================
        function generateProceduralQuestion(grade, subject) {
            let attempts = 0;
            let qObj = null;

            while (attempts < 50) {
                attempts++;
                if (subject === 'math') {
                    qObj = generateMathQuestion(grade);
                } else if (subject === 'chinese') {
                    qObj = generateChineseQuestion(grade);
                } else {
                    qObj = generateEnglishQuestion(grade);
                }

                if (!seenQuestionHashes.has(qObj.hash)) {
                    seenQuestionHashes.add(qObj.hash);
                    qObj.engineType = "程序化客製引擎";
                    stats.uniqueSeen = seenQuestionHashes.size;
                    updateReportUI();
                    return qObj;
                }
            }

            if (qObj) {
                qObj.question += ` (${Math.floor(Math.random()*900+100)})`;
                qObj.hash = calcHash(qObj.question);
                seenQuestionHashes.add(qObj.hash);
            }
            return qObj;
        }

        // --- 數學科：依年級細分多元觀念題型 (參考 zeroegg, 均一, tcool) ---
        function generateMathQuestion(grade) {
            const qType = Math.floor(Math.random() * 4); // 隨機切換題型主軸
            let questionText = '', answer = '', wrongOpts = [], topic = '';

            if (grade <= 2) {
                if (qType === 0) { // 加減法應用
                    const a = Math.floor(Math.random() * 30) + 10;
                    const b = Math.floor(Math.random() * 20) + 5;
                    const isAdd = Math.random() > 0.5;
                    if (isAdd) {
                        answer = a + b;
                        questionText = `小華有 ${a} 張貼紙，媽媽又給他 ${b} 張，請問現在小華共有幾張貼紙？`;
                        topic = "20以內/百以內加法";
                    } else {
                        const total = a + b;
                        answer = a;
                        questionText = `桌上有 ${total} 顆蘋果，大家吃了 ${b} 顆後，還剩下幾顆蘋果？`;
                        topic = "百以內減法";
                    }
                    wrongOpts = [answer + 2, answer - 2, answer + 5, answer - 1].filter(v => v > 0 && v !== answer);
                } else if (qType === 1) { // 鐘面與時間觀念
                    const hour = Math.floor(Math.random() * 12) + 1;
                    const isHalf = Math.random() > 0.5;
                    answer = isHalf ? `${hour}點30分` : `${hour}點整`;
                    questionText = `時針指向 ${hour} 與 ${hour % 12 + 1} 之間，分針指向 6，請問現在是什麼時間？`;
                    topic = "認識時間與鐘面";
                    wrongOpts = [`${hour}點整`, `${hour % 12 + 1}點整`, `${hour % 12 + 1}點30分`].filter(v => v !== answer);
                } else if (qType === 2) { // 數的順序與大小
                    const base = Math.floor(Math.random() * 70) + 10;
                    answer = base + 1;
                    questionText = `請選出在數字「${base}」後面、緊接著的下一個數字是哪一個？`;
                    topic = "數的順序與大小";
                    wrongOpts = [base - 1, base + 2, base + 10].filter(v => v !== answer);
                } else { // 基礎長度與比較
                    questionText = "下列哪一個物品的長度，最適合用「公分(cm)」作為測量單位？";
                    answer = "橡皮擦的長度";
                    topic = "長度單位初步觀念";
                    wrongOpts = ["操場一圈的長度", "從台北到高雄的距離", "高速公路的長度"];
                }
            } else if (grade <= 4) {
                if (qType === 0) { // 乘除四則計算
                    const a = Math.floor(Math.random() * 12) + 3;
                    const b = Math.floor(Math.random() * 8) + 2;
                    answer = a * b;
                    questionText = `一包餅乾裝有 ${b} 片，老師買了 ${a} 包，總共有幾片餅乾？`;
                    topic = "乘法應用與計算";
                    wrongOpts = [answer + b, answer - b, a + b, answer + 2].filter(v => v > 0 && v !== answer);
                } else if (qType === 1) { // 周長與面積
                    const w = Math.floor(Math.random() * 8) + 3;
                    const h = Math.floor(Math.random() * 6) + 2;
                    const isArea = Math.random() > 0.5;
                    if (isArea) {
                        answer = w * h;
                        questionText = `有一個長方形花園，長為 ${w} 公尺、寬為 ${h} 公尺，請問它的「面積」是多少平方公尺？`;
                        topic = "長方形面積計算";
                        wrongOpts = [(w + h) * 2, w * h + 2, w + h].filter(v => v !== answer);
                    } else {
                        answer = (w + h) * 2;
                        questionText = `有一個長方形框框，長為 ${w} 公分、寬為 ${h} 公分，請問它的「周長」是多少公分？`;
                        topic = "幾何圖形周長";
                        wrongOpts = [w * h, w + h, (w + h) * 2 + 2].filter(v => v !== answer);
                    }
                } else if (qType === 2) { // 分數初步
                    const den = Math.floor(Math.random() * 5) + 5; // 分母 5~9
                    const num1 = Math.floor(Math.random() * 2) + 1;
                    const num2 = Math.floor(Math.random() * 2) + 1;
                    answer = `${num1 + num2}/${den}`;
                    questionText = `小明吃了 ${num1}/${den} 個披薩，小華吃了 ${num2}/${den} 個披薩，兩人一共吃了幾個披薩？`;
                    topic = "同分母分數加法";
                    wrongOpts = [`${num1 + num2}/${den * 2}`, `${num1 * num2}/${den}`, `${num1 + num2 + 1}/${den}`].filter(v => v !== answer);
                } else { // 時間單位換算
                    const mins = Math.floor(Math.random() * 3) + 2; // 2~4分鐘
                    const secs = Math.floor(Math.random() * 40) + 10;
                    answer = mins * 60 + secs;
                    questionText = `體育課跑步測試，小美花了 ${mins} 分 ${secs} 秒到達終點，請問這等於多少秒？`;
                    topic = "時間單位換算";
                    wrongOpts = [mins * 100 + secs, mins * 60 + secs + 10, (mins + 1) * 60].filter(v => v !== answer);
                }
            } else { // 5-6年級
                if (qType === 0) { // 因數與倍數
                    const p1 = 3, p2 = 5;
                    const mult = Math.floor(Math.random() * 4) + 1;
                    answer = p1 * p2 * mult;
                    questionText = `有一個正整數，它同時是 3 和 5 的倍數，請問下列哪一個數可能是這個數？`;
                    topic = "公倍數與公因數";
                    wrongOpts = [p1 * mult + 1, p2 * mult + 2, 22, 28].filter(v => v !== answer);
                } else if (qType === 1) { // 比與比值 / 折扣
                    const price = (Math.floor(Math.random() * 5) + 2) * 100; // 200~600
                    const discount = Math.floor(Math.random() * 3) + 7; // 7~9折
                    answer = Math.round(price * (discount / 10));
                    questionText = `一件衣服原價 ${price} 元，服飾店舉辦特價打 ${discount} 折，請問買這件衣服要付多少元？`;
                    topic = "百分比與折扣應用";
                    wrongOpts = [price - discount * 10, price * discount, Math.round(price * 0.5)].filter(v => v !== answer);
                } else if (qType === 2) { // 速率問題
                    const dist = (Math.floor(Math.random() * 4) + 2) * 60; // 120~300km
                    const time = Math.floor(Math.random() * 2) + 2; // 2~3小時
                    answer = dist / time;
                    questionText = `爸爸開車行駛了 ${dist} 公里，共花了 ${time} 小時，請問爸爸開車的平均時速是多少公里/小時？`;
                    topic = "速率、時間與距離";
                    wrongOpts = [dist * time, dist - time, answer + 10].filter(v => v !== answer);
                } else { // 體積計算
                    const a = Math.floor(Math.random() * 5) + 3;
                    answer = a * a * a;
                    questionText = `有一個正方體積木，邊長為 ${a} 公分，請問它的「體積」是多少立方公分？`;
                    topic = "正方體體積計算";
                    wrongOpts = [a * a * 6, a * 12, a * a].filter(v => v !== answer);
                }
            }

            // 選項組合與洗牌
            const opts = shuffleArray([`${answer}`, ...wrongOpts.slice(0, 3).map(v => `${v}`)]);
            const correctIndex = opts.indexOf(`${answer}`);

            return {
                question: questionText,
                options: opts,
                correctIndex: correctIndex,
                topic: topic,
                explanations: opts.map(o => o === `${answer}` ? `正確答案！解題觀念：${topic}。觀念計算結果為 ${answer}。` : `此選項不正確，正確計算解答應為 ${answer}。`),
                hash: calcHash(questionText)
            };
        }

        // --- 國語科：多元題型主軸（錯別字、修辭、句型、成語、詞性）---

                    { pattern: '因果句', correct: '因為昨晚沒睡好，所以他今天上課時一直打瞌睡。', wrong: ['雖然這道題目很難，他還是解出來了。', '無論遇到什麼困難，我們都要勇敢面對。', '他一邊走路，一邊聽音樂。'] }

                    { word: '畫蛇添足', ans: '比喻多此一舉，反而弄巧成拙', wrong: ['形容繪畫技巧精湛', '比喻速度非常迅速', '形容觀察非常仔細'] },
                    { word: '雪中送炭', ans: '在人困難時給予及時幫助', wrong: ['形容冬天取暖的方法', '形容禮物非常貴重', '比喻雪景非常美麗'] },
                    { word: '守株待兔', ans: '比喻不知變通，奢望僥倖成功', wrong: ['形容照顧動物很用心', '比喻農夫非常勤勞', '形容動作靈敏反應快'] }

        // --- 英語科：多元題型主軸（字彙分類、基礎文法、情境對話）---
        function generateEnglishQuestion(grade) {

            if (qType === 0) { // 基礎文法與句型 (Be動詞, 介系詞, 單複數)

        // ==========================================
        // AI 智慧出題 (提示詞同步強化，參考題庫網多元觀念)
        // ==========================================
        async function fetchAIQuestionDirect(grade, subject) {
            const subjectNameMap = { math: '數學', chinese: '國語', english: '英語' };
            const randomSeed = Math.floor(Math.random() * 100000);

            const systemPrompt = `你是一位熟悉台灣國小課程標準（參考均一、tcool、Pagamo、StudyArk 等學習平台）的優秀教師。
請為國小 ${grade} 年級學生設計 1 題具有高度教育價值的原創 ${subjectNameMap[subject]} 題目。

【命題重點說明】：
1. 國語科：請靈活選擇以下一種題型出題，切勿拘泥於故事情境——「字形字音辨析/錯別字」、「修辭法判讀（譬喻、擬人、設問等）」、「句型結構（轉折、因果）」、「成語活用」、「短文/童詩閱讀理解」。
2. 數學科：請依年級設計符合課程標準的觀念題——「低年級：數的順序/加減/時間鐘面」、「中年級：四則運算/周長面積/分數」、「高年級：因數倍數/比與折扣/速率/體積」。
3. 英語科：請靈活設計「情境對話判讀」、「基礎文法（Be動詞/介系詞/時態）」或「主題單字理解」。

請嚴格輸出 JSON 格式：
{
  "question": "題目內文（簡潔明確）",
  "options": ["選項A", "選項B", "選項C", "選項D"],
  "correctIndex": 0,
  "topic": "考核主題名稱",
  "explanations": ["選項A解析", "選項B解析", "選項C解析", "選項D解析"]
}`;

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${DEFAULT_API_KEY}`;
            const payload = {
                contents: [{ parts: [{ text: `請為國小${grade}年級${subjectNameMap[subject]}設計 1 題高品質原創練習題 (隨機種子:${randomSeed})` }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: { 
                    responseMimeType: "application/json",
                    maxOutputTokens: 400,
                    temperature: 0.95
                }
            };

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 3000); // 3秒逾時自動降級

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (!response.ok) throw new Error("API Limit or Error");
                const data = await response.json();
                const jsonText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!jsonText) throw new Error("No data");

                const parsed = JSON.parse(jsonText);
                const hash = calcHash(parsed.question);

                if (seenQuestionHashes.has(hash)) {
                    throw new Error("Duplicate AI Question Detected");
                }

                seenQuestionHashes.add(hash);
                parsed.hash = hash;
                parsed.engineType = "AI 智慧引擎";
                stats.uniqueSeen = seenQuestionHashes.size;
                updateReportUI();
                return parsed;
            } catch (err) {
                clearTimeout(timeoutId);
                throw err;
            }
        }

        async function fillPrefetchQueue() {
            if (isPrefetching || prefetchQueue.length >= 2) return;
            isPrefetching = true;
            try {
                const q = await fetchAIQuestionDirect(currentGrade, currentSubject);
                prefetchQueue.push(q);
            } catch (e) {
                // 若 AI 逾時，預載程序化題目補位
                const procQ = generateProceduralQuestion(currentGrade, currentSubject);
                prefetchQueue.push(procQ);
            } finally {
                isPrefetching = false;
            }
        }

        // ==========================================
        // 核心調度器 (融合 AI 與程序化雙引擎)
        // ==========================================
        async function generateQuestion(forceFresh = false) {
            showLoading(true);
            resetTimer();

            if (forceFresh) {
                prefetchQueue = [];
            }

            let qData = null;

            // 1. 優先從預載佇列取題
            if (prefetchQueue.length > 0 && !forceFresh) {
                qData = prefetchQueue.shift();
            } else {
                // 2. 即時請求 AI 出題，若失敗則無縫降級至程序化引擎
                try {
                    document.getElementById('loadingText').innerText = "雙引擎打造專屬客製化題目中...";
                    qData = await fetchAIQuestionDirect(currentGrade, currentSubject);
                } catch (err) {
                    qData = generateProceduralQuestion(currentGrade, currentSubject);
                }
            }

            const badge = document.getElementById('sourceBadge');
            if (qData.engineType === "AI 智慧引擎") {
                badge.className = "text-xs font-bold px-3 py-1 rounded-full bg-amber-100 text-amber-800 border border-amber-200 flex items-center gap-1";
                badge.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles text-amber-500"></i> AI 智慧靈感題`;
            } else {
                badge.className = "text-xs font-bold px-3 py-1 rounded-full bg-indigo-100 text-indigo-800 border border-indigo-200 flex items-center gap-1";
                badge.innerHTML = `<i class="fa-solid fa-bolt text-indigo-500"></i> 程序化萬級客製題`;
            }

            currentQuestion = qData;
            
            if (historyIndex < questionHistory.length - 1) {
                questionHistory = questionHistory.slice(0, historyIndex + 1);
            }
            questionHistory.push(qData);
            historyIndex = questionHistory.length - 1;

            renderQuestionUI(qData);
            showLoading(false);
            startTimer();

            fillPrefetchQueue();
        }

        function renderQuestionUI(qData) {
            isAnswered = false;
            selectedOptionIndex = null;

            document.getElementById('qBadgeGrade').innerText = `小${['一','二','三','四','五','六'][currentGrade-1]}`;
            document.getElementById('qBadgeSub').innerText = currentSubject === 'math' ? '數學' : (currentSubject === 'chinese' ? '國語' : '英語');
            document.getElementById('qBadgeTopic').innerText = qData.topic || '觀念練習';
            document.getElementById('questionHashText').innerText = `ID: #${qData.hash || '0000'}`;

            document.getElementById('questionText').innerText = qData.question;

            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';

            qData.options.forEach((optText, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-2xl border-2 border-slate-200 hover:border-indigo-400 hover:bg-indigo-50/50 transition-all duration-200 flex items-start gap-3 bg-white readable-option-text shadow-sm hover:shadow`;
                btn.onclick = () => selectOption(idx);
                btn.innerHTML = `
                    <span class="w-8 h-8 rounded-xl bg-slate-100 text-slate-700 flex items-center justify-center font-black text-base flex-shrink-0 mt-0.5">${String.fromCharCode(65 + idx)}</span>
                    <span class="flex-1">${optText}</span>
                `;
                container.appendChild(btn);
            });

            document.getElementById('explanationContainer').classList.add('hidden');
        }

        function selectOption(index) {
            if (isAnswered) return;
            isAnswered = true;
            stopTimer();

            selectedOptionIndex = index;
            stats.total++;

            const isCorrect = (index === currentQuestion.correctIndex);
            if (isCorrect) {
                stats.correct++;
            } else {
                stats.wrong++;
                recordWrongQuestion(currentQuestion, index, "答題錯誤");
            }
            updateReportUI();

            const container = document.getElementById('optionsContainer');
            const buttons = container.children;

            Array.from(buttons).forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === currentQuestion.correctIndex) {
                    btn.className = `w-full text-left p-4 rounded-2xl border-2 border-emerald-500 bg-emerald-50 text-emerald-900 readable-option-text flex items-start gap-3 shadow-md`;
                } else if (idx === index && !isCorrect) {
                    btn.className = `w-full text-left p-4 rounded-2xl border-2 border-rose-500 bg-rose-50 text-rose-900 readable-option-text flex items-start gap-3 shadow-md`;
                } else {
                    btn.className = `w-full text-left p-4 rounded-2xl border-2 border-slate-100 bg-slate-50/60 text-slate-400 readable-option-text flex items-start gap-3 opacity-60`;
                }
            });

            const expBox = document.getElementById('explanationContainer');
            const resultHeader = document.getElementById('resultHeader');
            const explanationText = document.getElementById('explanationText');

            expBox.classList.remove('hidden');

            if (isCorrect) {
                resultHeader.className = "text-lg font-black mb-3 flex items-center gap-2 text-emerald-600";
                resultHeader.innerHTML = `<i class="fa-solid fa-circle-check text-2xl"></i> 太棒了！回答正確！`;
            } else {
                resultHeader.className = "text-lg font-black mb-3 flex items-center gap-2 text-rose-600";
                resultHeader.innerHTML = `<i class="fa-solid fa-circle-xmark text-2xl"></i> 差一點點！再接再厲！`;
            }

            let expHTML = `<div class="p-3 bg-white rounded-xl border border-slate-200 mb-3 shadow-sm">
                <span class="font-extrabold text-indigo-700">【題目重點解析】</span> ${currentQuestion.explanations[currentQuestion.correctIndex] || '解析詳情如上。'}
            </div>`;

            expHTML += `<div class="space-y-2 mt-2"><div class="font-bold text-slate-700 text-sm">各選項詳細註釋：</div>`;
            currentQuestion.options.forEach((optStr, i) => {
                const isAns = (i === currentQuestion.correctIndex);
                const optExp = (currentQuestion.explanations && currentQuestion.explanations[i]) ? currentQuestion.explanations[i] : (isAns ? '正確選項。' : '非正確選項。');
                
                expHTML += `<div class="p-2.5 rounded-xl text-sm ${isAns ? 'bg-emerald-100/70 border border-emerald-300 text-emerald-950 font-bold' : 'bg-slate-100 border border-slate-200 text-slate-800'}">
                    <span class="font-black mr-1">${String.fromCharCode(65 + i)}. ${optStr}：</span> ${optExp}
                </div>`;
            });
            expHTML += `</div>`;

            explanationText.innerHTML = expHTML;
        }

        // ==========================================
        // 倒數計時與未答題自動紀錄機制
        // ==========================================
        function startTimer() {
            stopTimer();
            timerSeconds = 60;
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                timerSeconds--;
                updateTimerDisplay();

                if (timerSeconds <= 0) {
                    stopTimer();
                    handleTimeOut();
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function resetTimer() {
            stopTimer();
            timerSeconds = 60;
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            const timerText = document.getElementById('timerText');
            timerText.innerText = `${timerSeconds}s`;
            if (timerSeconds <= 10) {
                timerText.classList.add('timer-warning');
            } else {
                timerText.classList.remove('timer-warning');
            }
        }

        function handleTimeOut() {
            if (!isAnswered && currentQuestion) {
                isAnswered = true;
                recordWrongQuestion(currentQuestion, null, "答題逾時 (60秒)");
                showToast("⏰ 答題時間到！已自動幫你記錄至錯題本");
                selectOption(currentQuestion.correctIndex);
            }
        }

        function handleNavQuestion(action) {
            if (!isAnswered && currentQuestion) {
                recordWrongQuestion(currentQuestion, null, "未答題直接跳過");
                showToast("📝 已自動將未答題目加入錯題本紀錄！");
            }

            if (action === 'prev') {
                if (historyIndex > 0) {
                    historyIndex--;
                    currentQuestion = questionHistory[historyIndex];
                    renderQuestionUI(currentQuestion);
                    resetTimer();
                    startTimer();
                } else {
                    showToast("已經是第一題囉！");
                }
            } else if (action === 'next') {
                if (historyIndex < questionHistory.length - 1) {
                    historyIndex++;
                    currentQuestion = questionHistory[historyIndex];
                    renderQuestionUI(currentQuestion);
                    resetTimer();
                    startTimer();
                } else {
                    generateQuestion(false);
                }
            } else if (action === 'change') {
                generateQuestion(true);
            }
        }

        function recordWrongQuestion(q, userChoiceIdx, reason) {
            wrongQuestions.unshift({
                question: q.question,
                options: q.options,
                correctIndex: q.correctIndex,
                userChoice: userChoiceIdx !== null ? q.options[userChoiceIdx] : "未作答",
                reason: reason,
                topic: q.topic || "綜合題型",
                time: new Date().toLocaleTimeString()
            });
            updateWrongBadge();
        }

        function updateWrongBadge() {
            document.getElementById('wrongCountBadge').innerText = wrongQuestions.length;
            document.getElementById('statWrong').innerText = wrongQuestions.length;
        }

        function updateReportUI() {
            document.getElementById('statTotal').innerText = stats.total;
            const acc = stats.total > 0 ? Math.round((stats.correct / stats.total) * 100) : 0;
            document.getElementById('statAccuracy').innerText = `${acc}%`;
            document.getElementById('statUnique').innerText = stats.uniqueSeen;
        }

        function renderWrongList() {
            const list = document.getElementById('wrongList');
            if (wrongQuestions.length === 0) {
                list.innerHTML = `<div class="text-center py-10 text-slate-400 font-bold">目前沒有任何錯題紀錄，繼續保持！✨</div>`;
                return;
            }

            list.innerHTML = wrongQuestions.map((item, idx) => `
                <div class="bg-slate-50 rounded-2xl p-4 border border-slate-200 text-slate-800 space-y-2 relative">
                    <div class="flex justify-between items-center text-xs text-slate-500 font-bold">
                        <span class="bg-rose-100 text-rose-700 px-2 py-0.5 rounded-lg">${item.topic}</span>
                        <span>${item.reason} • ${item.time}</span>
                    </div>
                    <p class="font-extrabold text-base text-slate-800">${item.question}</p>
                    <div class="text-sm font-bold space-y-1">
                        <div class="text-emerald-700">正確答案：${item.options[item.correctIndex]}</div>
                        <div class="text-rose-600">你的選擇：${item.userChoice}</div>
                    </div>
                </div>
            `).join('');
        }

        function clearWrongList() {
            wrongQuestions = [];
            updateWrongBadge();
            renderWrongList();
            showToast("錯題本已清空！");
        }

        // ==========================================
        // UI 設定切換
        // ==========================================
        function setGrade(g) {
            currentGrade = g;
            prefetchQueue = [];
            updateGradeButtons();
            generateQuestion();
        }

        function updateGradeButtons() {
            for (let i = 1; i <= 6; i++) {
                const btn = document.getElementById(`grade-${i}`);
                if (i === currentGrade) {
                    btn.className = "grade-btn py-1.5 px-2 text-xs md:text-sm font-black rounded-xl bg-indigo-600 text-white border border-indigo-600 shadow-sm";
                } else {
                    btn.className = "grade-btn py-1.5 px-2 text-xs md:text-sm font-bold rounded-xl border border-slate-200 bg-white text-slate-700 hover:bg-slate-50";
                }
            }
        }

        function setSubject(s) {
            currentSubject = s;
            prefetchQueue = [];
            updateSubjectButtons();
            generateQuestion();
        }

        function updateSubjectButtons() {
            ['math', 'chinese', 'english'].forEach(sub => {
                const btn = document.getElementById(`sub-${sub}`);
                if (sub === currentSubject) {
                    btn.className = "sub-btn flex-1 py-1.5 px-3 text-xs md:text-sm font-black rounded-xl bg-rose-500 text-white border border-rose-500 shadow-sm";
                } else {
                    btn.className = "sub-btn flex-1 py-1.5 px-3 text-xs md:text-sm font-bold rounded-xl border border-slate-200 bg-white text-slate-700 hover:bg-slate-50";
                }
            });
        }

        function showLoading(show) {
            const overlay = document.getElementById('loadingOverlay');
            if (show) overlay.classList.remove('hidden');
            else overlay.classList.add('hidden');
        }

        function openModal(id) {
            if (id === 'wrongModal') renderWrongList();
            document.getElementById(id).classList.remove('hidden');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        window.onload = function() {
            updateGradeButtons();
            updateSubjectButtons();
            generateQuestion();
        };
    </script>
</body>
</html>
