<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國小國英數智慧題庫練習系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Sans TC', 'Fredoka', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* 鮮豔彩虹七色動態漸層底色 (紅橙黃綠藍靛紫) */
        body {
            background: linear-gradient(135deg, #ff4e50, #ff9233, #fbd46d, #20bf6b, #0fbcf9, #3867d6, #8854d0, #f368e0);
            background-size: 300% 300%;
            animation: rainbowAnimation 12s ease infinite;
            min-height: 100vh;
            user-select: none;
        }

        @keyframes rainbowAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .custom-shadow {
            box-shadow: 0 16px 35px -5px rgba(0, 0, 0, 0.25), 0 10px 15px -6px rgba(0, 0, 0, 0.15);
        }
        
        .option-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .option-card:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.01);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 4px;
        }
    </style>
</head>
<body class="font-sans text-slate-800 flex flex-col justify-between antialiased">

    <!-- Top Header Card (放大且置中強烈氣勢) -->
    <header class="w-full pt-6 pb-2 px-4 sticky top-0 z-30">
        <div class="max-w-4xl mx-auto bg-white/95 backdrop-blur-md border-4 border-yellow-300 rounded-3xl p-5 md:p-6 custom-shadow text-center">
            
            <!-- 可愛彩虹繪本圖示 -->
            <div class="text-3xl md:text-4xl mb-2 space-x-2 flex justify-center items-center">
                <span>🎓</span><span>📚</span><span>🌈</span><span>✏️</span><span>🎨</span>
            </div>

            <!-- 主標題 (放大且水平置中) -->
            <h1 class="text-3xl md:text-4xl lg:text-5xl font-black text-slate-900 tracking-tight mb-2 leading-tight">
                <span class="text-rose-600">國小專用</span> 快樂學習去~練習真有趣
            </h1>

            <!-- 副標題 -->
            <p class="text-sm md:text-base font-extrabold text-sky-800 bg-sky-100/90 inline-block px-5 py-1.5 rounded-full border border-sky-300 shadow-sm">
                ✨ 生活化無限情境，智慧練習題 ✨
            </p>

            <!-- 選項與功能按鈕區 -->
            <div class="mt-4 flex flex-wrap items-center justify-center gap-2.5 text-sm font-bold">
                <!-- 年級選擇器 -->
                <div class="relative">
                    <select id="gradeSelect" onchange="changeFilter()" class="bg-amber-100 border-2 border-amber-400 text-amber-950 font-extrabold py-2 px-4 pr-8 rounded-2xl appearance-none shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-500 cursor-pointer">
                        <option value="1">一年級 (G1)</option>
                        <option value="2">二年級 (G2)</option>
                        <option value="3">三年級 (G3)</option>
                        <option value="4">四年級 (G4)</option>
                        <option value="5">五年級 (G5)</option>
                        <option value="6">六年級 (G6)</option>
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-3 top-3.5 text-xs text-amber-800 pointer-events-none"></i>
                </div>

                <!-- 科目選擇器 -->
                <div class="relative">
                    <select id="subjectSelect" onchange="changeFilter()" class="bg-emerald-100 border-2 border-emerald-400 text-emerald-950 font-extrabold py-2 px-4 pr-8 rounded-2xl appearance-none shadow-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 cursor-pointer">
                        <option value="math">🧮 數學領域</option>
                        <option value="chi">📖 國語領域</option>
                        <option value="eng">🔤 英語領域</option>
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-3 top-3.5 text-xs text-emerald-800 pointer-events-none"></i>
                </div>

                <!-- 錯題本按鈕 -->
                <button onclick="toggleNotebookModal()" class="bg-rose-500 hover:bg-rose-600 text-white px-4 py-2 rounded-2xl font-black transition flex items-center gap-2 shadow-md relative border-2 border-rose-300">
                    <i class="fa-solid fa-book-bookmark text-base"></i>
                    <span>錯題本</span>
                    <span id="notebookBadge" class="hidden absolute -top-2 -right-2 bg-yellow-400 text-slate-900 text-xs w-5 h-5 rounded-full flex items-center justify-center font-black border-2 border-white">0</span>
                </button>

                <!-- 學習戰報按鈕 -->
                <button onclick="toggleStatsModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-2xl font-black transition flex items-center gap-2 shadow-md border-2 border-indigo-300">
                    <i class="fa-solid fa-chart-line text-base"></i>
                    <span>學習戰報</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主練習區域 -->
    <main class="max-w-4xl w-full mx-auto px-4 py-4 flex-grow flex flex-col justify-center">

        <!-- 狀態與答題倒數條 (60 秒倒數與彩虹進度條) -->
        <div class="bg-white/95 backdrop-blur-md p-4 rounded-3xl border-2 border-white/60 custom-shadow mb-4">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-3 text-sm">
                <div class="flex items-center gap-3">
                    <span class="text-xs font-black px-3.5 py-1.5 bg-sky-500 text-white rounded-full flex items-center shadow-sm" id="tagBadge">
                        <i class="fa-solid fa-graduation-cap mr-1.5"></i>載入中...
                    </span>
                    <span class="text-slate-700 font-extrabold text-xs" id="questionIndex">題目序號: #1</span>
                </div>
                <div class="flex items-center gap-4 font-black">
                    <div class="text-amber-600 flex items-center gap-1" title="連續答對">
                        <i class="fa-solid fa-fire text-amber-500 text-lg"></i>
                        <span id="streakCount">0</span> 連勝
                    </div>
                    <div class="text-slate-800">
                        正確率: <span id="accuracyRate" class="text-sky-600">100%</span>
                    </div>
                </div>
            </div>

            <!-- 60秒倒數計時進度條 -->
            <div>
                <div class="flex justify-between items-center text-xs font-black text-slate-700 mb-1">
                    <span class="flex items-center gap-1"><i class="fa-solid fa-clock text-amber-500 animate-pulse text-sm"></i> 答題限時倒數</span>
                    <span id="timerText" class="text-rose-600 font-black text-sm bg-rose-100 px-2.5 py-0.5 rounded-full border border-rose-300">60 秒</span>
                </div>
                <div class="w-full bg-slate-200 rounded-full h-3.5 p-0.5 border border-slate-300 overflow-hidden">
                    <div id="timerBar" class="h-full rounded-full transition-all duration-1000 ease-linear" style="width: 100%; background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);"></div>
                </div>
            </div>
        </div>

        <!-- 題目主要卡片 -->
        <div class="bg-white/95 backdrop-blur-md rounded-3xl p-6 md:p-8 border-4 border-sky-200 custom-shadow relative mb-6">
            
            <!-- 題目頭部 (包含單元主題與朗讀) -->
            <div class="flex justify-between items-start gap-4 mb-4">
                <div class="flex flex-wrap items-center gap-2">
                    <span class="bg-amber-400 text-amber-950 text-xs font-black px-3.5 py-1.5 rounded-xl border border-amber-500" id="topicName">單元主題</span>
                </div>
                <button onclick="speakQuestion()" class="text-slate-700 hover:text-sky-700 p-2 rounded-2xl bg-sky-100 hover:bg-sky-200 transition flex items-center gap-1.5 text-xs font-black border border-sky-300 shadow-sm" title="語音朗讀">
                    <i class="fa-solid fa-volume-high text-base text-sky-600"></i>
                    <span class="hidden sm:inline">朗讀題目</span>
                </button>
            </div>

            <!-- AI / 生成載入動畫 -->
            <div id="aiLoading" class="hidden py-12 text-center">
                <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-purple-500 border-t-transparent mb-3"></div>
                <p class="text-purple-800 font-black text-base">正在即時建構生活化 108 課綱擬真試題...</p>
            </div>

            <!-- 題目本文 -->
            <div class="text-xl md:text-2xl font-black text-slate-900 mb-6 leading-relaxed" id="questionStem">
                題目載入中，請稍候...
            </div>

            <!-- 選項區域 (大字清晰) -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6" id="optionsContainer">
                <!-- 動態載入選項 -->
            </div>

            <!-- 解析與註釋區塊 (預設隱藏，答題後呈現，大字清晰高對比) -->
            <div id="explanationBox" class="hidden mt-6 p-5 rounded-3xl bg-amber-50/90 border-2 border-amber-300 transition-all">
                <div class="flex items-center gap-2 font-black mb-3" id="resultStatusHeader">
                    <!-- 對錯指標 -->
                </div>

                <!-- 學習重點 (阿拉伯數字與清晰大字) -->
                <div class="text-base font-extrabold text-slate-900 mb-3 bg-white p-3.5 rounded-2xl border-2 border-amber-200 flex items-center gap-2" id="learningFocus">
                    <span>💡 學習重點：...</span>
                </div>

                <!-- 四選項詳細解析 (大字 1.18rem 以上、粗體 700、深色文字) -->
                <div class="text-base font-black text-slate-900 mb-3 flex items-center gap-1.5">
                    <i class="fa-solid fa-magnifying-glass text-sky-600"></i>
                    <span>四選項詳細註釋與解析：</span>
                </div>
                <div class="space-y-3" id="optionExplanationsList">
                    <!-- 動態渲染四選項詳細說明 -->
                </div>
            </div>

        </div>

        <!-- 底部控制按鈕區 -->
        <div class="flex items-center justify-between gap-3">
            <button id="prevBtn" onclick="prevQuestion()" disabled class="bg-white border-2 border-slate-300 hover:bg-slate-100 text-slate-800 disabled:opacity-40 disabled:cursor-not-allowed font-black px-5 py-3 rounded-2xl shadow-md transition flex items-center gap-2 text-sm">
                <i class="fa-solid fa-arrow-left"></i>
                <span>上一題</span>
            </button>

            <button id="rerollBtn" onclick="rerollQuestion()" class="bg-amber-500 hover:bg-amber-600 text-white font-black px-6 py-3 rounded-2xl shadow-lg transition flex items-center gap-2 text-sm border-2 border-amber-300" title="產生全新生活化題目">
                <i class="fa-solid fa-dice text-base"></i>
                <span>換一題</span>
            </button>

            <button id="nextBtn" onclick="nextQuestion()" class="bg-gradient-to-r from-sky-500 via-indigo-600 to-purple-600 hover:from-sky-600 hover:to-purple-700 text-white font-black px-7 py-3 rounded-2xl shadow-lg transition flex items-center gap-2 text-sm border-2 border-indigo-300">
                <span>下一題</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>

    </main>

    <!-- 個人複習錯題本 Modal -->
    <div id="notebookModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-3xl max-w-2xl w-full p-6 shadow-2xl border-4 border-rose-300 max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center mb-4 pb-3 border-b-2 border-slate-200">
                <h3 class="font-black text-xl text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-book-bookmark text-rose-500"></i>
                    個人複習錯題本
                </h3>
                <button onclick="toggleNotebookModal()" class="text-slate-400 hover:text-slate-700 text-2xl font-black">&times;</button>
            </div>

            <div id="notebookContent" class="overflow-y-auto flex-grow space-y-4 pr-1">
                <!-- 動態顯示錯題 -->
            </div>

            <div class="mt-4 pt-3 border-t-2 border-slate-200 flex justify-between items-center gap-2">
                <button onclick="clearNotebook()" class="text-xs text-rose-700 hover:text-rose-900 font-black px-4 py-2.5 bg-rose-100 rounded-xl border border-rose-300">
                    清空錯題本
                </button>
                <button onclick="toggleNotebookModal()" class="bg-slate-800 text-white font-black px-6 py-2.5 rounded-xl text-xs">
                    關閉
                </button>
            </div>
        </div>
    </div>

    <!-- 學習統計 Modal -->
    <div id="statsModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border-4 border-indigo-300">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-black text-xl text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-chart-pie text-indigo-600"></i>
                    學習進度與統計戰報
                </h3>
                <button onclick="toggleStatsModal()" class="text-slate-400 hover:text-slate-700 text-2xl font-black">&times;</button>
            </div>
            
            <div class="grid grid-cols-2 gap-3 mb-4">
                <div class="bg-sky-50 p-4 rounded-2xl text-center border-2 border-sky-200">
                    <div class="text-xs text-sky-700 font-bold mb-1">總答題數</div>
                    <div class="text-3xl font-black text-sky-900" id="totalAnsweredCount">0</div>
                </div>
                <div class="bg-emerald-50 p-4 rounded-2xl text-center border-2 border-emerald-200">
                    <div class="text-xs text-emerald-700 font-bold mb-1">答對題數</div>
                    <div class="text-3xl font-black text-emerald-900" id="correctAnsweredCount">0</div>
                </div>
            </div>

            <div class="bg-slate-50 p-4 rounded-2xl mb-4 text-xs space-y-2.5 border-2 border-slate-200 font-bold">
                <div class="flex justify-between">
                    <span class="text-slate-600">當前最高連勝：</span>
                    <span class="font-black text-slate-900" id="maxStreak">0 題</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-600">📖 國語完成題數：</span>
                    <span class="font-black text-slate-900" id="chiCount">0</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-600">🔤 英語完成題數：</span>
                    <span class="font-black text-slate-900" id="engCount">0</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-600">🧮 數學完成題數：</span>
                    <span class="font-black text-slate-900" id="mathCount">0</span>
                </div>
            </div>

            <button onclick="resetStats()" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-800 font-black py-2 rounded-xl transition text-xs mb-2">
                重置學習紀錄
            </button>
            <button onclick="toggleStatsModal()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-2.5 rounded-xl transition text-sm shadow-md">
                返回練習
            </button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs font-black px-5 py-3 rounded-full shadow-2xl opacity-0 transition pointer-events-none z-50 border border-slate-700">
        通知訊息
    </div>

    <!-- Footer -->
    <footer class="bg-white/80 backdrop-blur-md border-t-2 border-white/60 py-4 text-center text-xs font-black text-slate-800 mt-8">
        國小國英數-智慧題庫練習題2026 / 個人訓練版本
    </footer>

    <!-- Core Dynamic Question Generator & Engine Script -->
    <script>
        // --- Global State ---
        let currentGrade = 1;
        let currentSubject = 'math';
        let questionHistory = [];
        let historyIndex = -1;
        let dedupHashes = new Set();
        let wrongNotebook = JSON.parse(localStorage.getItem('quiz_wrong_notebook') || '[]');

        // Default API Key & AI state auto-enabled
        const DEFAULT_API_KEY = "AQ.Ab8RN6K9d3TmGt1UzlN_0xylEllVGoqtkJkQoBGH_pQCw87oZA";
        let aiConfig = {
            apiKey: DEFAULT_API_KEY,
            enabled: true
        };

        let timerInterval = null;
        let timeLeft = 60;

        let stats = JSON.parse(localStorage.getItem('quiz_stats') || JSON.stringify({
            total: 0,
            correct: 0,
            streak: 0,
            maxStreak: 0,
            chi: 0,
            eng: 0,
            math: 0
        }));

        // --- Randomization & Utility Functions ---
        function randInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function sample(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function shuffle(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2500);
        }

        function saveStats() {
            localStorage.setItem('quiz_stats', JSON.stringify(stats));
        }

        function updateNotebookBadge() {
            const badge = document.getElementById('notebookBadge');
            if (wrongNotebook.length > 0) {
                badge.innerText = wrongNotebook.length;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        // --- 60 秒倒數計時控制 ---
        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 60;
            updateTimerUI();

            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerUI();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeout();
                }
            }, 1000);
        }

        function updateTimerUI() {
            const timerText = document.getElementById('timerText');
            const timerBar = document.getElementById('timerBar');
            if (timerText) timerText.innerText = `${timeLeft} 秒`;
            if (timerBar) {
                const pct = Math.max(0, (timeLeft / 60) * 100);
                timerBar.style.width = `${pct}%`;
            }
        }

        function handleTimeout() {
            const q = questionHistory[historyIndex];
            if (!q || q.userAnswered !== undefined) return;
            
            showToast('⏰ 時間到！已將本題自動記入錯題本');
            recordUnansweredToNotebook(q, '超時未答');
            
            q.userAnswered = -1; // 標記為未答超時
            renderAnsweredState(q);
        }

        function recordUnansweredToNotebook(q, reason = '未作答') {
            if (!q || q.recordedToNotebook) return;
            q.recordedToNotebook = true;

            const correctObj = q.options.find(o => o.correct) || { text: '無解答' };
            wrongNotebook.unshift({
                stem: q.stem,
                userAns: `（${reason}）`,
                correctAns: correctObj.text,
                focus: q.focus,
                options: q.options,
                date: new Date().toLocaleDateString()
            });
            localStorage.setItem('quiz_wrong_notebook', JSON.stringify(wrongNotebook));
            updateNotebookBadge();
        }

        // --- 內建題庫動態生成器 (解析全阿拉伯數字，移除情境標籤) ---
        const SCENARIO_NAMES = ['創世神皮卡', '珍珠奶茶阿強', '偵探柯南', 'YouTuber 酷炫', '太空人小風', '寵物店喵喵', '賽車手小美', '烘焙師莉莉', '籃球員阿傑', '寶可夢大師小智'];

        const MATH_GENERATORS = {
            1: [
                () => {
                    const name = sample(SCENARIO_NAMES);
                    const a = randInt(10, 45); const b = randInt(12, 40);
                    const sum = a + b;
                    const stem = `${name} 收集了 ${a} 塊鑽石與 ${b} 塊金礦，請問他總共收集了幾塊礦石？`;
                    const opts = [
                        { text: `${sum} 塊`, correct: true, exp: `【正確】${a} + ${b} = ${sum}。2 位數加法計算精確！` },
                        { text: `${sum - 10} 塊`, correct: false, exp: `【錯誤】少算了 10，進位計算錯誤。` },
                        { text: `${sum + 2} 塊`, correct: false, exp: `【錯誤】個位數計算多加了 2。` },
                        { text: `${Math.abs(a - b)} 塊`, correct: false, exp: `【錯誤】這是求相差數量的減法，題目問「總共」應用加法。` }
                    ];
                    return { topic: '100 以內加法', stem, options: shuffle(opts), focus: '掌握 2 位數加法的基本計算。' };
                },
                () => {
                    const name = sample(SCENARIO_NAMES);
                    const price = randInt(15, 40); const pay = 50;
                    const change = pay - price;
                    const stem = `${name} 去店裡買了一杯 ${price} 元的飲品，付給店員 1 枚 50 元硬幣，請問應該找回多少元？`;
                    const opts = [
                        { text: `${change} 元`, correct: true, exp: `【正確】50 - ${price} = ${change} 元。找零計算正確！` },

        function createLocalQuestion(grade, subject) {

            else if (subject === 'eng') pool = ENG_GENERATORS[grade] || ENG_GENERATORS[1];

            let q = null;
            let attempts = 0;
            while (attempts < 10) {
                const generator = sample(pool);
                q = generator();
                const hash = `${q.stem}_${q.options[0].text}`;
                if (!dedupHashes.has(hash)) {
                    dedupHashes.add(hash);
                    break;
                }
                attempts++;
            }

            q.grade = grade;
            q.subject = subject;
            q.isAi = false;
            q.id = Date.now() + '_' + Math.random().toString(36).substr(2, 4);
            return q;
        }

        async function nextQuestion() {
            // 若當前題目尚未作答，自動記錄入錯題本
            const currentQ = questionHistory[historyIndex];
            if (currentQ && currentQ.userAnswered === undefined) {
                recordUnansweredToNotebook(currentQ, '未作答直接下一題');
            }

            if (historyIndex < questionHistory.length - 1) {
                historyIndex++;
                loadQuestionAtStackIndex();
            } else {
                await generateAndPushNewQuestion();
            }
        }

        async function generateAndPushNewQuestion() {
            showLoading(true);
            let q = null;

            if (aiConfig.enabled && aiConfig.apiKey) {
                try {
                    q = await fetchAiQuestion(currentGrade, currentSubject);
                    showToast('🤖 AI 成功即時生成生活化題目！');
                } catch (err) {
                    console.warn('AI 請求失敗，切換至內建動態題庫引擎:', err);
                    q = createLocalQuestion(currentGrade, currentSubject);
                }
            } else {
                q = createLocalQuestion(currentGrade, currentSubject);
            }

            showLoading(false);
            questionHistory.push(q);
            historyIndex++;
            loadQuestionAtStackIndex();
        }

            const q = questionHistory[historyIndex];
            
            document.getElementById('tagBadge').innerHTML = `<i class="fa-solid fa-graduation-cap mr-1"></i>小 ${q.grade} ${getSubjectName(q.subject)}`;
            document.getElementById('topicName').innerText = q.topic;
            document.getElementById('questionIndex').innerText = `題目序號: #${historyIndex + 1}`;
            document.getElementById('questionStem').innerText = q.stem;

            // 渲染選項
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';

            const prefixes = ['A', 'B', 'C', 'D'];
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `option-card text-left p-4 md:p-5 rounded-2xl border-3 border-slate-200 bg-white font-black text-slate-800 hover:border-sky-400 hover:bg-sky-50 flex items-start gap-3 w-full custom-shadow`;
                btn.onclick = () => handleAnswer(idx);
                btn.id = `optBtn_${idx}`;
                
                btn.innerHTML = `
                    <span class="bg-amber-200 text-amber-950 rounded-xl px-3 py-1 text-sm font-black shrink-0 border border-amber-300">${prefixes[idx]}</span>
                    <span class="text-base md:text-lg leading-snug pt-0.5">${opt.text}</span>
                `;
                container.appendChild(btn);
            });

            // 重置/開啟倒數計時
            if (q.userAnswered === undefined) {
                document.getElementById('explanationBox').classList.add('hidden');
                startTimer();
            } else {
                clearInterval(timerInterval);
                renderAnsweredState(q);
            }

            // 按鈕狀態
            document.getElementById('prevBtn').disabled = (historyIndex <= 0);
        }

        function handleAnswer(selectedIndex) {
            const q = questionHistory[historyIndex];
            if (q.userAnswered !== undefined) return;

            clearInterval(timerInterval); // 停止計時
            q.userAnswered = selectedIndex;
            const isCorrect = q.options[selectedIndex].correct;

            // 統計更新
            stats.total++;
            if (isCorrect) {
                stats.correct++;
                stats.streak++;
                if (stats.streak > stats.maxStreak) stats.maxStreak = stats.streak;
            } else {
                stats.streak = 0;
                // 自動記入錯題本
                wrongNotebook.unshift({
                    stem: q.stem,
                    userAns: q.options[selectedIndex].text,
                    correctAns: q.options.find(o => o.correct).text,
                    focus: q.focus,
                    options: q.options,
                    date: new Date().toLocaleDateString()
                });
                localStorage.setItem('quiz_wrong_notebook', JSON.stringify(wrongNotebook));
                updateNotebookBadge();
            }
            stats[q.subject]++;

            saveStats();
            updateStatsUI();
            renderAnsweredState(q);
        }

        function renderAnsweredState(q) {
            const isTimeout = (q.userAnswered === -1);
            const isCorrect = !isTimeout && q.options[q.userAnswered] && q.options[q.userAnswered].correct;
            const expBox = document.getElementById('explanationBox');
            expBox.classList.remove('hidden');

            // 答題結果頂部告示
            const statusHeader = document.getElementById('resultStatusHeader');
            if (isCorrect) {
                statusHeader.className = "flex items-center gap-2 font-black mb-3 text-emerald-700 text-lg md:text-xl";
                statusHeader.innerHTML = `<i class="fa-solid fa-circle-check text-2xl text-emerald-600"></i> 答對了！太棒了，完全掌握本題觀念！`;
            } else if (isTimeout) {
                statusHeader.className = "flex items-center gap-2 font-black mb-3 text-rose-700 text-lg md:text-xl";
                statusHeader.innerHTML = `<i class="fa-solid fa-clock text-2xl text-rose-600"></i> 答題時間到！已自動記入錯題本，請參閱詳細解析：`;
            } else {
                statusHeader.className = "flex items-center gap-2 font-black mb-3 text-rose-700 text-lg md:text-xl";
                statusHeader.innerHTML = `<i class="fa-solid fa-circle-xmark text-2xl text-rose-600"></i> 答錯囉！已自動記入錯題本，請參閱詳細解析：`;
            }

            // 選項按鈕標示
            const prefixes = ['A', 'B', 'C', 'D'];
            q.options.forEach((opt, idx) => {
                const btn = document.getElementById(`optBtn_${idx}`);
                btn.disabled = true;

                if (opt.correct) {
                    btn.className = `option-card text-left p-4 md:p-5 rounded-2xl border-4 border-emerald-500 bg-emerald-100/90 font-black text-emerald-950 flex items-start gap-3 w-full`;
                } else if (idx === q.userAnswered) {
                    btn.className = `option-card text-left p-4 md:p-5 rounded-2xl border-4 border-rose-500 bg-rose-100/90 font-black text-rose-950 flex items-start gap-3 w-full`;
                } else {
                    btn.className = `option-card text-left p-4 md:p-5 rounded-2xl border-2 border-slate-200 bg-slate-50 font-medium text-slate-400 opacity-60 flex items-start gap-3 w-full`;
                }
            });

            // 學習重點
            document.getElementById('learningFocus').innerText = `💡 學習重點：${q.focus || '掌握 108 課綱核心概念'}`;

            // 四選項詳細註釋與解析 (文字大且清晰 1.18rem ~ 1.25rem，高對比深色文字)
            const list = document.getElementById('optionExplanationsList');
            list.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const item = document.createElement('div');
                item.className = `p-4 rounded-2xl border-2 ${opt.correct ? 'bg-emerald-50 border-emerald-400 text-slate-900' : 'bg-white border-slate-300 text-slate-900'}`;
                item.innerHTML = `
                    <div class="font-black flex items-center gap-2 mb-1.5 text-[1.2rem] md:text-[1.25rem] text-slate-900">
                        <span class="px-3 py-0.5 rounded-xl ${opt.correct ? 'bg-emerald-300 text-emerald-950' : 'bg-slate-200 text-slate-800'}">${prefixes[idx]}</span>
                        <span>${opt.text}</span>
                        ${opt.correct ? '<span class="text-xs bg-emerald-600 text-white px-2.5 py-1 rounded-full font-black ml-auto">正確解答</span>' : ''}
                    </div>
                    <div class="text-[1.18rem] font-bold text-slate-900 leading-relaxed pl-2 mt-1">${opt.exp}</div>
                `;
                list.appendChild(item);
            });
        }

        function prevQuestion() {
            if (historyIndex > 0) {
                historyIndex--;
                loadQuestionAtStackIndex();
            }
        }

        async function rerollQuestion() {
            const currentQ = questionHistory[historyIndex];
            if (currentQ && currentQ.userAnswered === undefined) {
                recordUnansweredToNotebook(currentQ, '換題未作答');
            }

            showLoading(true);
            let newQ = null;
            if (aiConfig.enabled && aiConfig.apiKey) {
                try {
                    newQ = await fetchAiQuestion(currentGrade, currentSubject);
                } catch(e) {
                    newQ = createLocalQuestion(currentGrade, currentSubject);
                }
            } else {
                newQ = createLocalQuestion(currentGrade, currentSubject);
            }
            showLoading(false);
            questionHistory[historyIndex] = newQ;
            loadQuestionAtStackIndex();
            showToast('已重新產生全新生活化題目！');
        }

        function changeFilter() {
            currentGrade = parseInt(document.getElementById('gradeSelect').value);
            currentSubject = document.getElementById('subjectSelect').value;
            
            questionHistory = [];
            historyIndex = -1;
            nextQuestion();
            showToast(`已切換至 小學 ${currentGrade} 年級 ${getSubjectName(currentSubject)}`);
        }

        function getSubjectName(sub) {
            if (sub === 'math') return '數學';
            if (sub === 'chi') return '國語';
            if (sub === 'eng') return '英語';
            return '';
        }

        function updateStatsUI() {
            document.getElementById('streakCount').innerText = stats.streak;
            const acc = stats.total > 0 ? Math.round((stats.correct / stats.total) * 100) : 100;
            document.getElementById('accuracyRate').innerText = `${acc}%`;

            document.getElementById('totalAnsweredCount').innerText = stats.total;
            document.getElementById('correctAnsweredCount').innerText = stats.correct;
            document.getElementById('maxStreak').innerText = `${stats.maxStreak} 題`;
            document.getElementById('chiCount').innerText = `${stats.chi} 題`;
            document.getElementById('engCount').innerText = `${stats.eng} 題`;
            document.getElementById('mathCount').innerText = `${stats.math} 題`;
        }

        function resetStats() {
            stats = { total: 0, correct: 0, streak: 0, maxStreak: 0, chi: 0, eng: 0, math: 0 };
            saveStats();
            updateStatsUI();
            showToast('學習紀錄已重置');
        }

        // --- Modal 控制與渲染 ---
        function toggleStatsModal() {
            document.getElementById('statsModal').classList.toggle('hidden');
        }

        function toggleNotebookModal() {
            const modal = document.getElementById('notebookModal');
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) {
                renderNotebookContent();
            }
        }

        function renderNotebookContent() {
            const container = document.getElementById('notebookContent');
            if (wrongNotebook.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-slate-400 font-bold">
                        <i class="fa-solid fa-circle-check text-5xl text-emerald-400 mb-2"></i>
                        <p class="text-base text-slate-600 mt-2">太棒了！目前沒有累積的錯題！</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = wrongNotebook.map((item, idx) => `
                <div class="bg-amber-50/80 p-4 rounded-2xl border-2 border-amber-200 text-sm">
                    <div class="flex justify-between items-start font-black text-slate-800 mb-2">
                        <span class="text-amber-800">錯題 #${wrongNotebook.length - idx}</span>
                        <span class="text-slate-500 text-xs">${item.date}</span>
                    </div>
                    <div class="font-black text-slate-900 text-base mb-3 leading-snug">${item.stem}</div>
                    <div class="space-y-1.5 mb-2 font-bold">
                        <div class="text-rose-700">您的答案：${item.userAns}</div>
                        <div class="text-emerald-700">正確答案：${item.correctAns}</div>
                    </div>
                    <div class="text-slate-800 bg-white p-3 rounded-xl border border-amber-300 font-bold text-xs">
                        💡 觀念說明：${item.focus || '複習該單元的核心概念。'}
                    </div>
                </div>
            `).join('');
        }

        function clearNotebook() {
            wrongNotebook = [];
            localStorage.removeItem('quiz_wrong_notebook');
            updateNotebookBadge();
            renderNotebookContent();
            showToast('已清空錯題本');
        }

        // 語音朗讀 (TTS)
        function speakQuestion() {
            if (!('speechSynthesis' in window)) {
                showToast('您的瀏覽器不支援語音朗讀');
                return;
            }
            window.speechSynthesis.cancel();
            const q = questionHistory[historyIndex];
            const text = `${q.stem}。 選項：${q.options.map((o, i) => `${['A','B','C','D'][i]}，${o.text}`).join('。 ')}`;
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = currentSubject === 'eng' ? 'en-US' : 'zh-TW';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }

        // 初始化頁面
        window.onload = function() {
            updateStatsUI();
            updateNotebookBadge();
            nextQuestion();
        };
    </script>
</body>
</html>
